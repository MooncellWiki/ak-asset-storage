# S3 兼容对象存储,替代 docker-compose.yaml 的 rustfs 服务。凭据与 e2e/开发配置一致(torappu/torappu123)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          # 同 compose:入口参数是数据目录
          args: [/data]
          env:
            - name: RUSTFS_ADDRESS
              value: 0.0.0.0:9000
            - name: RUSTFS_CONSOLE_ADDRESS
              value: 0.0.0.0:9001
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_ACCESS_KEY
              value: torappu
            - name: RUSTFS_SECRET_KEY
              value: torappu123
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
# API 走 31000(替代 9000),控制台 31001(替代 9001)。
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  type: NodePort
  selector:
    app: rustfs
  ports:
    - name: api
      port: 9000
      targetPort: api
      nodePort: 31000
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-console
spec:
  type: NodePort
  selector:
    app: rustfs
  ports:
    - name: console
      port: 9001
      targetPort: console
      nodePort: 31001
