# 开发库,替代 docker-compose.yaml 的 db 服务。凭据与根目录 .env 一致(仅本地开发用)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:17.6
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: POSTGRES_USER
              value: ak
            - name: POSTGRES_PASSWORD
              value: ak
            - name: POSTGRES_DB
              value: ak_asset_storage_next
            # local-path 卷的挂载点可能有 initdb 不认的东西,数据放子目录。
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # 官方镜像入口以 root 起:CHOWN 修数据目录属主,SETGID/SETUID 降权成 postgres。
              add: [CHOWN, SETGID, SETUID]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# NodePort 32432 替代原先的 25432;DATABASE_URL 里写 localhost:32432。
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 32432
