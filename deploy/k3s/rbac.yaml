# RBAC example for the server/worker to launch the asset-extraction Job
# (the in-cluster deployment mode of the `[torappu.kubernetes]` config).
#
# The namespace must match `torappu.kubernetes.namespace`. Adjust it if the
# app runs elsewhere:
#
#   kubectl -n ak-asset-storage apply -f deploy/k3s/rbac.yaml
#   kubectl -n ak-asset-storage create secret docker-registry ak-registry-cred \
#     --docker-server=registry.example.com \
#     --docker-username=... --docker-password=...
#
# Then set on the server/worker pod spec:
#
#   spec.template.spec.serviceAccountName: ak-asset-storage
#
# IMPORTANT: jobs.create cannot be limited by resourceNames or Pod fields.
# RBAC alone is not a sandbox. The cluster administrator must also install
# admission rules for the permitted image, volumes and security context.
# The extractor account below must have no RoleBinding and never mount an
# API token. Match resourceNames to torappu.kubernetes.job_name if changed.
# Match the extractor name to torappu.kubernetes.service_account_name too;
# update any admission account allowlist when renaming it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ak-asset-storage
  namespace: ak-asset-storage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ak-asset-extractor
  namespace: ak-asset-storage
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ak-asset-storage-job-launcher
  namespace: ak-asset-storage
rules:
  # CREATE has no name restriction in RBAC; enforce it with admission.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create]
  - apiGroups: [batch]
    resources: [jobs]
    resourceNames: [ak-asset-job]
    verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ak-asset-storage-job-launcher
  namespace: ak-asset-storage
subjects:
  - kind: ServiceAccount
    name: ak-asset-storage
    namespace: ak-asset-storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ak-asset-storage-job-launcher
