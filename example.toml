# Application logging configuration
[logger]
enable = true
level = "debug"
format = "compact"
# override_filter = "trace"  # Uncomment to override filters

# Web server configuration
[server]
port = 5150
host = "http://localhost"

# Mailer Configuration
[mailer]
host = "smtp.example.com"
port = 465
from_email = "sender@example.com"
to_email = "receiver@example.com"
frontend_url = "http://localhost:5150/"

auth.user = "user@example.com"  # Uncomment and add SMTP user
auth.password = "password"  # Uncomment and add SMTP password

# Database Configuration
[database]
uri = "postgres://ak:ak@localhost:25432/ak_asset_storage_next"

[ak]
asset_url = "https://ak.hycdn.cn/assetbundle/official/Android/assets"
conf_url = "https://ak-conf.hypergryph.com/config/prod/official/Android"

[s3]
endpoint = "http://127.0.0.1:9000"
bucket_name = "arknights-assets"
access_key_id = "access_key_id"
secret_access_key = "secret_access_key"
with_virtual_hosted_style_request = false

# Optional Sentry configuration for error tracking
[sentry]
dsn = "https://your-sentry-dsn@sentry.io/project-id"
traces_sample_rate = 1.0

# Optional MCP (Model Context Protocol) endpoint; disabled unless enabled.
# When enabled, MCP clients connect to <host>:<port>/mcp (Streamable HTTP) and
# can query versions, the manifest tree, bundles, story resources and the raw
# asset directory — all read-only tools.
[mcp]
enable = false
# Optional bearer token. When set, clients must send
# `Authorization: Bearer <token>`. Leave unset only for localhost deployments.
# auth_token = "change-me"
# Optional allowlist of Host headers accepted on /mcp (e.g. for
# asset-storage.example.com). Unset accepts any Host.
# allowed_hosts = ["asset-storage.example.com"]

# Optional Torappu configuration
[torappu]
token = "your-torappu-token-here"
asset_base_path = "/assets"

# Optional Docker configuration for launching containers on new version detection
[torappu.docker]
image_url = "your-docker-image:latest"
container_name = "ak-asset-container"
env_vars = [ "TZ=Asia/Shanghai" ]
volume_mapping = [ "./data:/app/data" ]
network = "boot_default"
username = "registry-username"
password = "registry-password"
# Prefer a filtering proxy (e.g. tecnativa/docker-socket-proxy with
# CONTAINERS=1 IMAGES=1 POST=1) over handing the raw socket to this process:
# docker_host = "tcp://docker-socket-proxy:2375"
docker_host = "/var/run/docker.sock"

# Optional GitHub Actions configuration for triggering workflows
[torappu.github]
owner = "your-username"
repo = "your-repo"
workflow_id = "workflow-file.yml"
ref = "main"
token = "github-token"
