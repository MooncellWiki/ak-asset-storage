# Secret fields can also be provided via environment variables; a non-empty
# variable overrides the value in this file:
#   DATABASE_URI          -> database.uri
#   S3_ACCESS_KEY_ID      -> s3.access_key_id
#   S3_SECRET_ACCESS_KEY  -> s3.secret_access_key
#   MAILER_AUTH_PASSWORD  -> mailer.auth.password
#   TORAPPU_TOKEN         -> torappu.token
#   TORAPPU_GITHUB_TOKEN  -> torappu.github.token
# Omit a secret field when its variable is set. Optional mailer and GitHub
# integrations still require their non-secret configuration in this file.

# Application logging configuration
[logger]
enable = true
level = "debug"
format = "compact"
# override_filter = "trace"  # Uncomment to override filters

# Web server configuration
[server]
port = 5150
# Public base URL; MCP file results link to <host>/assets/... and
# <host>/gamedata/...
host = "http://localhost:5150"

# Mailer Configuration
[mailer]
host = "smtp.example.com"
port = 465
from_email = "sender@example.com"
to_email = "receiver@example.com"
frontend_url = "http://localhost:5150/"

auth.user = "user@example.com"  # Uncomment and add SMTP user
auth.password = "password"  # Uncomment and add SMTP password; or set MAILER_AUTH_PASSWORD

# Database Configuration
[database]
uri = "postgres://ak:ak@localhost:32432/ak_asset_storage_next"  # or set DATABASE_URI

[ak]
asset_url = "https://ak.hycdn.cn/assetbundle/official/Android/assets"
conf_url = "https://ak-conf.hypergryph.com/config/prod/official/Android"

[s3]
endpoint = "http://127.0.0.1:31000"
bucket_name = "arknights-assets"
access_key_id = "access_key_id"  # or set S3_ACCESS_KEY_ID
secret_access_key = "secret_access_key"  # or set S3_SECRET_ACCESS_KEY
with_virtual_hosted_style_request = false

# Optional Sentry configuration for error tracking
[sentry]
dsn = "https://your-sentry-dsn@sentry.io/project-id"
traces_sample_rate = 1.0

# Optional MCP (Model Context Protocol) endpoint; disabled unless enabled.
# When enabled, MCP clients connect to <host>:<port>/mcp (Streamable HTTP) and
# can query versions, the manifest tree, bundles, story resources and the
# extracted asset tree (file entries carry download URLs) — all read-only tools.
# Requests are stateless and use JSON responses; replicas need no sticky
# routing or shared MCP session store.
[mcp]
enable = false

# Optional Torappu configuration
[torappu]
token = "your-torappu-token-here"  # or set TORAPPU_TOKEN
asset_base_path = "/assets"
# Maximum asset searches (REST + MCP combined) running at once;
# excess requests fail fast with 503 instead of queueing.
search_concurrency = 4

# File search requires plocate (preinstalled in the published Docker image).
# The first index build starts with the server; until it finishes, search
# returns 503. Failed refreshes keep the previous index. There is no tree walk.
# REST and MCP return { results, truncated }: default 100, maximum 200 entries,
# with no pagination or total count. Narrow the query when truncated is true.
[torappu.plocate]
update_interval_seconds = 600
# database_path = "/var/lib/ak-asset-storage/plocate.db"
# Default: /var/lib/ak-asset-storage/plocate.db. Custom paths must also be
# outside the asset tree.
# The parent directory must be writable by this process. Mount it separately
# to preserve the index across container replacements; otherwise it is rebuilt.
# Search excludes gamedata/latest and its descendants;
# use versioned gamedata paths when searching.

# Optional Kubernetes configuration for launching the asset-extraction Job
# on new version detection (k3s deployment mode). Credentials resolve like
# kube-rs Config::infer: $KUBECONFIG/~/.kube/config first, then the in-cluster
# service account, so keep kubeconfigs out of the server/worker pod.
# The server/worker pod needs the ServiceAccount from deploy/k3s/rbac.yaml.
# Apply its separate ak-asset-extractor ServiceAccount too; extraction Jobs
# have no API token. Install cluster-side admission constraints as well:
# jobs.create RBAC does not restrict images, volumes or security settings.
# Upgrade the Torappu image to its non-root version and make existing output
# directories writable by its UID/GID before enabling the new launcher.
[torappu.kubernetes]
# Image pulls and retries are handled by kubelet. Configure any registry
# credentials on the Kubernetes nodes.
image_url = "your-registry/your-image:latest"
namespace = "ak-asset-storage"
# Fixed Job name; doubles as the single-flight lock, a launch is rejected
# while a Job with this name is still running.
job_name = "ak-asset-job"
# Unprivileged, tokenless account; create it in the configured namespace.
# If renamed, update the ServiceAccount manifest and cluster admission rules.
service_account_name = "ak-asset-extractor"
# Jobs always require a non-root user. Omit these to use the image's USER
# (Torappu: 10001:10001), or match the owner of your output volumes.
# run_as_user = 10001
# run_as_group = 10001
env_vars = [ "TZ=Asia/Shanghai" ]
# Fails a Job that has not finished in time (default 6h), including one stuck
# in ImagePullBackOff or Pending, so it cannot block later launches forever.
# active_deadline_seconds = 21600

# One block per mounted volume; set exactly one of pvc / host_path.
# The mounted path must be the same volume the worker watches, so the Job's
# output lands inside torappu.asset_base_path.
[[torappu.kubernetes.volume_mounts]]
pvc = "ak-asset-data"
mount_path = "/app/data"
# host_path = "/srv/ak-asset-storage/data"  # single-node alternative

# Optional GitHub Actions configuration for triggering workflows
[torappu.github]
owner = "your-username"
repo = "your-repo"
workflow_id = "workflow-file.yml"
ref = "main"
token = "github-token"  # or set TORAPPU_GITHUB_TOKEN
