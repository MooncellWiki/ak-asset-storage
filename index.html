<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>Arknights Asset Storage</title>
    <meta name="description" content="Arknights Asset Storage" />
    <script>
      // Apply the stored appearance before the first paint (see app/common/theme.ts).
      (function () {
        try {
          var mode = localStorage.getItem("akas-theme");
          if (mode === "light" || mode === "dark")
            document.documentElement.setAttribute("data-theme", mode);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="ak-scope">
    <div id="app"></div>
    <noscript>
      <div>Please enable JavaScript to use this application.</div>
    </noscript>
    <script type="module" src="/app/main.ts"></script>
  </body>
</html>
