name: release
on:
  push:
    tags:
      - "*"

env:
  # The CDN serves this bucket prefix. Asset names hash content but not this
  # URL, so moving FE_CDN needs a fresh prefix: existing objects are skipped.
  FE_CDN: https://static.prts.wiki/torappu-fe/
  FE_OSS_PREFIX: torappu-fe/

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "cache=ghcr.io/${REPOSITORY,,}-cache:buildcache" >> "$GITHUB_OUTPUT"
          echo "frontend-cache=ghcr.io/${REPOSITORY,,}-cache:frontend" >> "$GITHUB_OUTPUT"

      # The assets go to OSS before the image is pushed, so the chunks its
      # index.html names are on the CDN by the time it is deployed.
      - name: Build frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          target: frontend
          outputs: type=local,dest=${{ runner.temp }}/frontend
          build-args: AK_FE_CDN=${{ env.FE_CDN }}
          # Its own cache: the image build below takes this output instead of
          # building these stages, so the image's cache no longer holds them.
          cache-from: type=registry,ref=${{ steps.image.outputs.frontend-cache }}
          cache-to: type=registry,ref=${{ steps.image.outputs.frontend-cache }},mode=max,ignore-error=true

      - name: Setup ossutil
        uses: ./.github/actions/setup-oss

      - name: Upload frontend assets
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          # GitHub runners are overseas; use OSS transfer acceleration.
          OSS_ENDPOINT: oss-accelerate.aliyuncs.com
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          : "${OSS_BUCKET:?Set the OSS_BUCKET repository secret}"
          .github/scripts/upload-frontend.sh "$RUNNER_TEMP/frontend" "$FE_CDN" "oss://$OSS_BUCKET/$FE_OSS_PREFIX"

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and Push Docker Image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The uploaded files, not a rebuild that could differ from them.
          build-contexts: frontend=${{ runner.temp }}/frontend
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.image.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.image.outputs.cache }},mode=max,ignore-error=true

      # Sentry steps run after the push so they cannot block the image. The
      # export reuses this builder's cache; the check confirms it matches the
      # pushed binary rather than a rebuild.
      - name: Export Sentry debug file
        uses: docker/build-push-action@v7
        with:
          context: .
          target: debug-files
          outputs: type=local,dest=${{ runner.temp }}/sentry-debug
          build-contexts: frontend=${{ runner.temp }}/frontend
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.image.outputs.cache }}

      - name: Setup sentry-cli
        uses: ./.github/actions/sentry-cli

      - name: Check debug file matches the pushed binary
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build-and-push.outputs.digest }}
        run: .github/scripts/check-sentry-debug-file.sh "$IMAGE" "$RUNNER_TEMP/sentry-debug/ak-asset-storage.debug"

      - name: Upload debug file
        uses: actions/upload-artifact@v7
        with:
          name: sentry-debug-file
          path: ${{ runner.temp }}/sentry-debug/
          if-no-files-found: error
          retention-days: 7

  # Separate job: a Sentry outage or token problem fails only this job, which
  # can be re-run on its own without rebuilding the image.
  sentry:
    name: Sentry release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup sentry-cli
        uses: ./.github/actions/sentry-cli

      - name: Download debug file
        uses: actions/download-artifact@v8
        with:
          name: sentry-debug-file
          path: ${{ runner.temp }}/sentry-debug

      - name: Upload debug file and create release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Release tags match the Cargo version that sentry::release_name!() reports.
          RELEASE: ak-asset-storage@${{ needs.build.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          : "${SENTRY_AUTH_TOKEN:?Set the SENTRY_AUTH_TOKEN repository secret}"
          sentry-cli debug-files upload --wait-for 600 "$RUNNER_TEMP/sentry-debug"
          sentry-cli releases new "$RELEASE"
          sentry-cli releases set-commits "$RELEASE" --commit "$REPOSITORY@$GITHUB_SHA"
          sentry-cli releases finalize "$RELEASE"
