name: release
on:
  push:
    tags:
      - "*"

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "cache=ghcr.io/${REPOSITORY,,}-cache:buildcache" >> "$GITHUB_OUTPUT"

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Export Sentry debug files
        uses: docker/build-push-action@v7
        with:
          context: .
          target: debug-files
          outputs: type=local,dest=${{ runner.temp }}/sentry-debug
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.image.outputs.cache }}

      - name: Upload Sentry debug files
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mooncellwiki
          SENTRY_PROJECT: ak-asset-storage-backend
        run: |
          : "${SENTRY_AUTH_TOKEN:?Set the SENTRY_AUTH_TOKEN repository secret}"
          npx --yes @sentry/cli@3.8.2 debug-files upload --wait "$RUNNER_TEMP/sentry-debug"

      - name: Associate Sentry release with commit
        id: sentry-release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mooncellwiki
          SENTRY_PROJECT: ak-asset-storage-backend
          REPOSITORY: ${{ github.repository }}
        run: |
          # Release tags (vX.Y.Z) match the Cargo version used by sentry::release_name!().
          release="ak-asset-storage@${GITHUB_REF_NAME#v}"
          echo "version=$release" >> "$GITHUB_OUTPUT"
          npx --yes @sentry/cli@3.8.2 releases new "$release"
          npx --yes @sentry/cli@3.8.2 releases set-commits "$release" --commit "$REPOSITORY@$GITHUB_SHA"

      - name: Build and Push Docker Image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.image.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.image.outputs.cache }},mode=max,ignore-error=true

      - name: Finalize Sentry release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mooncellwiki
          SENTRY_PROJECT: ak-asset-storage-backend
          SENTRY_RELEASE: ${{ steps.sentry-release.outputs.version }}
        run: npx --yes @sentry/cli@3.8.2 releases finalize "$SENTRY_RELEASE"
