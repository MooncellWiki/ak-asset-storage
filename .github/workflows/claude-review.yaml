name: Claude Code Review

# Manual only: someone with write access comments "@claude review" on a PR.
on:
  issue_comment:
    types: [created]

jobs:
  review:
    # Cheap pre-filter. claude-code-action then rejects bots and anyone
    # without write/admin permission, read-only collaborators included.
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.comment.body, '@claude review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level so that unrelated comments (skipped runs) never cancel a
    # pending review.
    concurrency:
      group: claude-review-${{ github.event.issue.number }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      # Base branch at the root: project rules (CLAUDE.md / AGENTS.md) come
      # from here, never from the pull request.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          path: pr-head
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job token, scoped to the permissions above and expiring with
          # the job, instead of the broader Claude GitHub App token.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            仓库：${{ github.repository }}，PR #${{ github.event.issue.number }}。
            当前目录是默认分支，PR 的代码在 ./pr-head。CLAUDE.md / AGENTS.md 可以参考，但可能没跟上代码，以实际代码为准，有出入时自己核实。

            先用 Skill 调用内置 `code-review`，参数为 `xhigh ${{ github.event.issue.number }} --max-findings all`，再逐条核实它给出的候选问题。
            报告这次改动里所有已确认或可能存在的问题。改动前就存在、和这次改动无关的问题不报，之前 Claude 审查指出过的不重复。

            每个问题用 mcp__github_inline_comment__create_inline_comment（confirmed: true）发一条行内评论，注明是已确认还是可能，写清依据和触发条件，小修复附 suggestion。
            最后用 `gh pr comment` 发一条总结。评论都用简体中文。

            触发评论如下，`@claude review` 之后的内容是额外的审查要求：
            ${{ github.event.comment.body }}
          # auto: a classifier approves ordinary read-only commands (git, pipes)
          # that the built-in code-review needs and blocks risky ones such as
          # sending credentials out; the PR itself is untrusted input.
          claude_args: |
            --model claude-opus-5-5
            --effort xhigh
            --permission-mode auto
            --allowedTools "Skill(code-review),mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
            --disallowedTools "Edit,Write,NotebookEdit"
