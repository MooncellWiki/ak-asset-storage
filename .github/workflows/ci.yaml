name: CI
on:
  push:
    branches:
      - main
  pull_request:

env:
  SQLX_OFFLINE: true

permissions:
  contents: read

jobs:
  rustfmt:
    name: Check Rust Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1

  clippy:
    name: Run Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Setup Node
        uses: ./.github/actions/node
      - name: Build frontend
        shell: bash
        run: pnpm run build
      - name: Run cargo clippy
        shell: bash
        run: cargo clippy --locked --all-features -- -D warnings

  eslint:
    name: Check frontend style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: ./.github/actions/node
      - name: Run eslint
        shell: bash
        run: pnpm run lint
      - name: Build frontend
        shell: bash
        run: pnpm run build
      - name: Check frontend types
        shell: bash
        run: pnpm run typecheck

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Setup Node
        uses: ./.github/actions/node
      - name: Build frontend
        shell: bash
        run: pnpm run build
      # The plocate search tests need real updatedb/plocate binaries and fail
      # (instead of skipping) when CI is set and they are missing.
      - name: Install plocate
        shell: bash
        run: |
          # Skip the package's full-runner scan; tests build their own indexes.
          sudo mkdir -p /var/lib/plocate
          sudo touch /var/lib/plocate/plocate.db
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends plocate
      - name: Run cargo test
        shell: bash
        run: cargo test --locked --all-features -- --nocapture
