name: CI
on:
  push:
    branches:
      - main
  pull_request:

env:
  SQLX_OFFLINE: true

permissions:
  contents: read

jobs:
  rustfmt:
    name: Check Rust Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
          cache: false
      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1

  clippy:
    name: Run Clippy
    runs-on: ubuntu-latest
    needs: eslint

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist
      - name: Run cargo clippy
        shell: bash
        run: cargo clippy --locked --all-features -- -D warnings

  eslint:
    name: Check frontend style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: ./.github/actions/node
      - name: Run eslint
        shell: bash
        run: pnpm run lint
      - name: Build frontend
        shell: bash
        run: pnpm run build
      - name: Check frontend types
        shell: bash
        run: pnpm run typecheck
      - name: Upload frontend
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: eslint
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist
      # The plocate search tests need real updatedb/plocate binaries and fail
      # (instead of skipping) when CI is set and they are missing.
      - name: Install plocate
        uses: ./.github/actions/plocate
      - name: Run cargo test
        shell: bash
        run: cargo test --locked --all-features -- --nocapture
      # sqlx::test creates an isolated database per test. Scoped by name because
      # the other ignored tests run in the separate e2e job.
      - name: Run PostgreSQL tests
        shell: bash
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: cargo test --locked --all-features --lib database::story_explorer -- --ignored --nocapture

  e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    needs: eslint
    timeout-minutes: 30
    env:
      AK_E2E_DEPENDENCIES: external
      # Compile against a migrated database that the e2e harness never resets.
      DATABASE_URL: postgres://ak:ak@localhost:32432/ak_asset_storage_next
      SQLX_OFFLINE: "false"
      RUST_BACKTRACE: "1"
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: ak
          POSTGRES_PASSWORD: ak
          POSTGRES_DB: ak_asset_storage_next
        ports:
          - 32432:5432
        options: >-
          --health-cmd "pg_isready -U ak -d ak_asset_storage_next"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rustfs:
        image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
        env:
          RUSTFS_ACCESS_KEY: torappu
          RUSTFS_SECRET_KEY: torappu123
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_CONSOLE_ENABLE: "false"
        ports:
          - 31000:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist
      - name: Install plocate
        uses: ./.github/actions/plocate
      - name: Install SQLx CLI
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.9.0
      - name: Install RustFS CLI
        env:
          VERSION: 0.1.36
          SHA256: 4a8128911ccad4e7b481f26635a4cfd1ec064412210526e57ad2c748d356f3b7
        run: |
          bin="$RUNNER_TEMP/rustfs-cli"
          mkdir -p "$bin"
          archive="rustfs-cli-linux-amd64-v$VERSION.tar.gz"
          curl -fsSL --retry 3 -o "$bin/$archive" \
            "https://github.com/rustfs/cli/releases/download/v$VERSION/$archive"
          echo "$SHA256  $bin/$archive" | sha256sum --check --strict
          tar -xzf "$bin/$archive" -C "$bin" rc
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/rc" --version
      - name: Migrate compile-time database
        run: sqlx migrate run
      # Service container logs are printed by the runner's "Stop containers" step.
      - name: Run e2e tests
        run: |
          cargo test --locked --all-features --test e2e -- \
            --ignored --nocapture --test-threads=1

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Docker toolchain versions
        run: python3 .github/scripts/check-docker-toolchains.py
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ak-asset-storage:ci
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=docker-ci
          cache-to: type=gha,scope=docker-ci,mode=max,ignore-error=true
      - name: Check runtime image
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          version=$(docker run --rm ak-asset-storage:ci /app/ak-asset-storage version)
          [[ "$version" == *" ($BUILD_SHA)" ]]
          docker run --rm --entrypoint sh ak-asset-storage:ci -ec '
            test ! -e /var/lib/plocate/plocate.db
            test -z "$(ls -A /var/lib/apt/lists)"
            mkdir -p /tmp/assets
            touch /tmp/assets/smoke-asset.txt
            updatedb --database-root /tmp/assets --output /tmp/assets.db --require-visibility 0
            plocate --database /tmp/assets.db smoke-asset.txt | grep -Fx /tmp/assets/smoke-asset.txt
          '
      # Same debug-file path as the release workflow, without uploading.
      - name: Export Sentry debug file
        uses: docker/build-push-action@v7
        with:
          context: .
          target: debug-files
          outputs: type=local,dest=${{ runner.temp }}/sentry-debug
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=docker-ci
      - name: Setup sentry-cli
        uses: ./.github/actions/sentry-cli
      - name: Check Sentry debug file
        run: |
          .github/scripts/check-sentry-debug-file.sh ak-asset-storage:ci "$RUNNER_TEMP/sentry-debug/ak-asset-storage.debug"
